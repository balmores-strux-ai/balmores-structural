# Custom domains (balmoreslab.com):
# - List ONLY www.* in `domains` below so Render redirects apex → www (not www → apex).
#   If you list the bare root first, Render sends www → apex and broken-apex TLS strands users.
# - DNS: www CNAME → your-service.onrender.com; apex A → 216.24.57.1 (Render). Remove AAAA.
# - Cloudflare: SSL "Full (strict)" OR proxy off (gray cloud) so Render terminates TLS cleanly.
# After changing this file, sync the Blueprint in the Render dashboard (or push if auto-sync).
#
# Free-tier cold start: visitors may see Render's "SERVICE WAKING UP" page for 30–60s
# after idle. Mitigations in this repo:
#   1) .github/workflows/keep-render-awake.yml — pings www + backend every 10 min (enable Actions)
#   2) Upgrade either service to Render Starter ($7/mo) for always-on — no wake screen
services:
  - type: web
    name: balmores-structural-backend
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      # 3.10.14 is not always available on Render; 3.10.12 is stable.
      - key: PYTHON_VERSION
        value: "3.10.12"
      # CRITICAL for cloud hosting: the backend defaults to LLM_LOCAL_ONLY=1,
      # which makes LocalOnlyFirewall reject EVERY request that isn't loopback
      # (including Render's own /health probe and the frontend proxy) with 403.
      # On Render the backend sits behind a load balancer that adds
      # x-forwarded-for, so leaving this at the default 403s the whole service
      # and the deploy never goes healthy. Turn the loopback lockdown OFF here:
      # PyNite FEA then serves everyone, and the local DeepSeek-R1 bridge simply
      # reports "offline" (there is no Ollama on Render) instead of crashing.
      - key: LLM_LOCAL_ONLY
        value: "0"
      - key: LLM_PUBLIC_TUNNEL
        value: "0"
      # The cloud backend has no GPU/Ollama — disable the LLM bridge so health
      # checks and FEA never wait on a model that can't exist here. The real
      # DeepSeek-R1 loop runs on the owner's PC via run-public-tunnel.bat.
      - key: LLM_ENABLED
        value: "0"
      # All public visitors reach the backend through the frontend proxy, so
      # they share one source IP. Raise the /llm/* token bucket generously so
      # the (cheap, model-less) deterministic summary endpoint isn't throttled
      # under normal traffic.
      - key: LLM_RATE_CAPACITY
        value: "240"
      - key: LLM_RATE_REFILL_PER_SEC
        value: "10"
      # Explicit PyNite vendored path — repo root is one level above backend/
      - key: BALMORES_PYNITE_ROOT
        value: "/opt/render/project/src/structural_analysis_pynite"
    # CPU torch: use --extra-index-url so torch deps (jinja2, etc.) resolve from PyPI (avoids pip metadata errors).
    buildCommand: pip install --no-cache-dir torch==2.2.2+cpu --extra-index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Optional env (set in dashboard): DATABASE_URL (Render Postgres), ALLOWED_ORIGINS (comma-separated),
    # SENTRY_DSN. See DEPLOY.md and backend/.env.example.

  - type: web
    name: balmores-structural-frontend
    runtime: node
    plan: free
    rootDir: frontend
    healthCheckPath: /
    domains:
      - www.balmoreslab.com
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # Server-side proxy target (browser calls same-origin /api/backend/*)
      - key: BACKEND_PROXY_URL
        value: https://balmores-structural-backend.onrender.com
      # Private server-side API key for the /api/backend/* proxy.
      # Set this in Render when BACKEND_PROXY_URL points to run-public-tunnel.bat.
      # Do NOT expose it as NEXT_PUBLIC_API_KEY.
      - key: BACKEND_API_KEY
        sync: false
      # Leave unset (or empty) so the app uses /api/backend → BACKEND_PROXY_URL (avoids mixed-content HTTP API).
      - key: NEXT_PUBLIC_API_URL
        sync: false
